name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1
  # Shared runners occasionally get 5xx from Maven Central / GitHub release CDN.
  # Gradle only retries 3x by default with a 1s backoff — widen both.
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.repository.max.retries=12
    -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 requires Node ^22.13 (see "engines" of expo / react-native).
      # NOTE: no `cache: npm` here — that option (and `npm ci`) needs a lockfile
      # committed to the repo, and this project does not have one.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every APK is named with its version + versionCode (read once, used by the
      # artifact name below). Two builds used to share one file name, which made
      # it impossible to tell which build was installed on the phone.
      - name: Read app version
        id: meta
        run: |
          V=$(node -p "require('./app.json').expo.version")
          C=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "apk=eKhata-v${V}-${C}.apk" >> "$GITHUB_OUTPUT"
          echo "Building eKhata v${V} (versionCode ${C})"

      # Gradle 9.4.1 (used by the Expo SDK 58 template) needs JDK 17+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # No lockfile in the repo → plain `npm install` (never `npm ci`).
      # The fallback covers npm ERESOLVE peer conflicts that a lockfile would normally pin away.
      - name: Install JS dependencies
        run: |
          npm install --no-audit --no-fund \
            || npm install --no-audit --no-fund --legacy-peer-deps

      # android/ is gitignored, so it is regenerated from the Expo template each run.
      # The template ships Gradle 9.4.1 + the react {} block; do not override either.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # Fails fast with a readable message instead of Gradle's "Cannot convert '' to File".
      - name: Verify node can resolve the app entry
        run: |
          node -v
          node -e "require('expo/scripts/resolveAppEntry')" "$GITHUB_WORKSPACE" android absolute

      # services.gradle.org stalls on shared runners and the wrapper's hard-coded
      # 10s read timeout kills the build before any retry can help. Fetch the
      # distribution ourselves with curl retries, then point the wrapper at the
      # local file so Gradle never touches the network for it.
      - name: Pre-download Gradle distribution
        shell: bash
        run: |
          url=$(grep -m1 '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties \
                | sed 's/^distributionUrl=//; s/\\//g')
          echo "distribution: $url"
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors \
               --connect-timeout 20 --max-time 900 \
               -o "$RUNNER_TEMP/gradle-dist.zip" "$url"
          ls -lh "$RUNNER_TEMP/gradle-dist.zip"
          echo "GRADLE_LOCAL_ZIP=$RUNNER_TEMP/gradle-dist.zip" >> "$GITHUB_ENV"

      - name: Point wrapper at the local distribution
        working-directory: android
        shell: bash
        run: |
          f=gradle/wrapper/gradle-wrapper.properties
          sed -i 's|^distributionUrl=.*|distributionUrl=file\://'"$GRADLE_LOCAL_ZIP"'|' "$f"
          cat "$f"

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version || true
          for attempt in 1 2 3 4; do
            echo "::group::assembleRelease attempt $attempt"
            if ./gradlew assembleRelease \
                 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
                 -Dorg.gradle.internal.repository.max.retries=12 \
                 -Dorg.gradle.internal.repository.initial.backoff=2000 \
                 --no-daemon --stacktrace; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = "4" ]; then
              echo "::error::assembleRelease failed after 4 attempts"
              exit 1
            fi
            sleep 30
          done

      - name: Name the APK after its version
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          cp app-release.apk "${{ steps.meta.outputs.apk }}"
          ls -lh
          sha256sum "${{ steps.meta.outputs.apk }}"
          echo "### eKhata ${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`${{ steps.meta.outputs.apk }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: eKhata-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.code }}
          path: android/app/build/outputs/apk/release/${{ steps.meta.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
