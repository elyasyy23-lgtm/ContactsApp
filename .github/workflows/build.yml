name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 requires Node ^22.13 (see "engines" of expo / react-native).
      # NOTE: no `cache: npm` here — that option (and `npm ci`) needs a lockfile
      # committed to the repo, and this project does not have one.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gradle 9.4.1 (used by the Expo SDK 58 template) needs JDK 17+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # No lockfile in the repo → plain `npm install` (never `npm ci`).
      # The fallback covers npm ERESOLVE peer conflicts that a lockfile would normally pin away.
      - name: Install JS dependencies
        run: |
          npm install --no-audit --no-fund \
            || npm install --no-audit --no-fund --legacy-peer-deps

      # android/ is gitignored, so it is regenerated from the Expo template each run.
      # The template ships Gradle 9.4.1 + the react {} block; do not override either.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # Fails fast with a readable message instead of Gradle's "Cannot convert '' to File".
      - name: Verify node can resolve the app entry
        run: |
          node -v
          node -e "require('expo/scripts/resolveAppEntry')" "$GITHUB_WORKSPACE" android absolute

      # services.gradle.org occasionally stalls on the shared runners; a 10s default
      # read timeout aborts the whole build. Give the wrapper room and retry.
      - name: Harden Gradle wrapper network
        working-directory: android
        run: |
          f=gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' "$f" || echo 'networkTimeout=180000' >> "$f"
          cat "$f"

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version
          for attempt in 1 2 3; do
            echo "::group::assembleRelease attempt $attempt"
            if ./gradlew assembleRelease \
                 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
                 --no-daemon --stacktrace; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" = "3" ]; then
              echo "::error::assembleRelease failed after 3 attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/
          sha256sum android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: contactsapp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
