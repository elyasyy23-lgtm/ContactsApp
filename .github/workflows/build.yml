name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --no-package-lock
      - run: npx expo prebuild --platform android
      - name: Download Gradle manually
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -O gradle.zip
          mkdir -p /home/runner/.gradle/wrapper/dists/gradle-9.4.1-bin
          unzip -q gradle.zip -d /home/runner/.gradle/wrapper/dists/gradle-9.4.1-bin/
          touch /home/runner/.gradle/wrapper/dists/gradle-9.4.1-bin/gradle-9.4.1-bin.zip.ok
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip" > gradle/wrapper/gradle-wrapper.properties
      - name: Setup Maven Mirror
        run: |
          echo "systemProp.maven.repo.local=https://maven.aliyun.com/repository/public" >> gradle.properties
          echo "systemProp.google.repo.local=https://maven.aliyun.com/repository/google" >> gradle.properties
      - run: cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
